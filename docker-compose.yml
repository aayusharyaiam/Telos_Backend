version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telos-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:80}
      - PORT=3000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
      - ENABLE_TEAMS_NOTIFICATIONS=${ENABLE_TEAMS_NOTIFICATIONS}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:80}
      - ENABLE_ESCALATION_JOB=false
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-evidence-files}
      - ENABLE_SUPABASE_STORAGE=${ENABLE_SUPABASE_STORAGE:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - telos-network

networks:
  telos-network:
    driver: bridge