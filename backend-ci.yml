name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'Telos_Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'Telos_Backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Telos_Backend/package-lock.json

      - name: Install dependencies
        working-directory: Telos_Backend
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: Telos_Backend
        run: npx prisma generate

      - name: Run tests
        working-directory: Telos_Backend
        run: npm test

      - name: Build application
        working-directory: Telos_Backend
        run: npm run build
        env:
          NODE_ENV: production

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Telos_Backend
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: Telos_Backend
        run: npm run lint || true